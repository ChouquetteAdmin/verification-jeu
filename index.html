<!DOCTYPE html>

<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>L'Assassin n'est pas Lucas — Solution</title>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:        #141414;
      --red:       #c0392b;
      --red2:      #e74c3c;
      --gold:      #c9a84c;
      --ip-blue:   #0d2d6b;
      --ip-blue2:  #163d8a;
      --ip-light:  #3a7fd4;
      --ip-border: #1e4080;
      --green:     #00e676;
      --mono:      'Share Tech Mono', monospace;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      background: var(--bg);
      color: #ffffff;
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 1.1rem;
      min-height: 100vh;
    }

    /* HEADER */

    header {
      background: var(--bg);
      border-bottom: 1px solid #222;
      padding: 36px 20px 28px;
      text-align: center;
    }

    .site-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.2rem, 12vw, 6rem);
      line-height: 0.9;
      letter-spacing: 0.02em;
      color: #ffffff;
    }

    .site-title .accent-red {
      color: var(--red);
    }

    .site-title .accent-name {
      color: #ffffff;
    }

    /* NAV */

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 22px 16px;
      background: #000000;
      border-top: 1px solid #111;
      border-bottom: 1px solid #111;
    }

    .tag {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #ffffff;
      border: 1.5px dashed rgba(255,255,255,0.7);
      border-radius: 2px;
      padding: 7px 16px;
      text-decoration: none;
      background: transparent;
      transition:
        color 0.2s,
        border-color 0.2s,
        background 0.2s,
        transform 0.15s;
    }

    .tag:hover {
      color: #ffffff;
      border-color: #ffffff;
      background: rgba(255,255,255,0.06);
      transform: translateY(-1px);
    }

    .tag.active {
      color: #ffffff;
      border-color: #ffffff;
      background: rgba(255,255,255,0.1);
    }

    /* MAIN */

    main {
      max-width: 660px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.06em;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .section-rule {
      height: 2px;
      background: linear-gradient(to right, var(--red), transparent);
      margin-bottom: 24px;
    }

    .section-body {
      font-size: 1.05rem;
      line-height: 1.75;
      color: #cccccc;
      margin-bottom: 18px;
    }

    .section-body em {
      color: #fff;
      font-style: italic;
    }

    .section-body strong {
      color: var(--gold);
    }

    /* PORTAL */

    .portal-wrap {
      margin: 36px 0 48px;
      border: 1px solid #222;
      border-radius: 3px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 0 40px rgba(0,0,0,0.5),
        0 16px 64px rgba(0,0,0,0.75);
    }

    .portal-titlebar {
      background: #000;
      border-bottom: 1px dashed rgba(255,255,255,0.15);
    }

    .titlebar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
    }

    .titlebar-dots {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }

    .dot-red { background: #ff5f57; }
    .dot-amber { background: #febc2e; }
    .dot-green { background: #28c840; }

    .titlebar-label {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
    }

    .titlebar-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--green);
    }

    .titlebar-status::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { opacity:1; }
      50% { opacity:0.4; }
    }

    /* BANNER */

    .portal-banner {
      background: #000000;
      padding: 20px 24px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px dashed rgba(255,255,255,0.2);
      position: relative;
      overflow: hidden;
    }

    .portal-banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 40px,
          rgba(255,255,255,0.02) 40px,
          rgba(255,255,255,0.02) 41px
        );
    }

    .interpol-badge {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .banner-text {
      position: relative;
      z-index: 1;
    }

    .banner-title {
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #fff;
      font-weight: 700;
    }

    .banner-subtitle {
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.5);
      margin-top: 3px;
      text-transform: uppercase;
    }

    .banner-ref {
      margin-left: auto;
      text-align: right;
      position: relative;
      z-index: 1;
    }

    .banner-ref span {
      display: block;
      font-family: var(--mono);
      font-size: 0.58rem;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.1em;
    }

    .banner-ref strong {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: #ffffff;
      letter-spacing: 0.08em;
    }

    /* BODY */

    .portal-body {
      background: #ffffff;
      padding: 28px 28px 24px;
      position: relative;
    }

    .portal-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 20px;
      border-bottom: 1px solid #ddd;
    }

    .ptab {
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 7px 14px;
      color: #aaa;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .ptab.active {
      color: #111;
      border-bottom-color: #111;
      background: rgba(0,0,0,0.04);
    }

    .classif {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding: 8px 12px;
      background: rgba(192,57,43,0.05);
      border: 1px solid rgba(192,57,43,0.2);
      border-radius: 1px;
    }

    .classif-badge {
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.2em;
      color: var(--red);
      border: 1px solid var(--red);
      padding: 2px 7px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .classif-text {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: #888;
      letter-spacing: 0.06em;
    }

    .db-field {
      margin-bottom: 16px;
    }

    .db-field label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #111;
      margin-bottom: 6px;
    }

    .db-field label::before {
      content: '▸';
      font-size: 0.7rem;
    }

    .db-field input {
      width: 100%;
      background: #f7f9fc;
      border: 1px solid #c5d4e8;
      border-radius: 1px;
      padding: 11px 14px;
      font-family: var(--mono);
      font-size: 0.92rem;
      color: #111;
      outline: none;
      letter-spacing: 0.08em;
    }

    .submit-btn {
      width: 100%;
      padding: 13px;
      background: #000;
      color: #fff;
      border: 1px dashed rgba(255,255,255,0.35);
      border-radius: 1px;
      font-family: var(--mono);
      font-size: 0.8rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 4px;
    }

    .submit-btn:hover {
      background: #111;
      transform: translateY(-1px);
    }

    .result {
      margin-top: 16px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s cubic-bezier(0.16,1,0.3,1), padding 0.4s;
      border-radius: 1px;
    }

    .result.show {
      max-height: 200px;
      padding: 16px;
    }

    .result.correct {
      background: rgba(0,180,80,0.07);
      border: 1px solid rgba(0,180,80,0.3);
    }

    .result.wrong {
      background: rgba(192,57,43,0.06);
      border: 1px solid rgba(192,57,43,0.25);
    }

    .terminal {
      margin-top: 18px;
      padding: 12px 14px;
      background: #111;
      border: 1px solid #222;
      border-radius: 1px;
      min-height: 52px;
    }

    .term-line {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: #2a6a3a;
      letter-spacing: 0.06em;
      line-height: 1.7;
    }

    .term-line.active { color: var(--green); }
    .term-line.err { color: var(--red2); }

    .cursor-block {
      display: inline-block;
      width: 8px;
      height: 13px;
      background: var(--green);
      vertical-align: middle;
      margin-left: 2px;
      animation: cblink 0.9s step-end infinite;
    }

    @keyframes cblink {
      0%,100% { opacity:1; }
      50% { opacity:0; }
    }

    .portal-statusbar {
      background: #000;
      border-top: 1px dashed rgba(255,255,255,0.15);
      padding: 7px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-left {
      font-family: var(--mono);
      font-size: 0.57rem;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .status-right {
      font-family: var(--mono);
      font-size: 0.57rem;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.1em;
    }

    /* CONTACT */

    .contact-section {
      margin-top: 48px;
    }

    .contact-section a {
      color: var(--red2);
      text-decoration: none;
      border-bottom: 1px solid rgba(231,76,60,0.3);
    }

    /* FOOTER */

    footer {
      background: #000000;
      border-top: 1px dashed rgba(255,255,255,0.15);
      padding: 22px 20px;
      text-align: center;
    }

    .footer-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1rem, 4vw, 1.4rem);
      letter-spacing: 0.18em;
      color: #fff;
      line-height: 1.5;
    }

    .footer-dot {
      color: rgba(255,255,255,0.4);
      margin: 0 6px;
    }

  </style>
</head>

<body>

<header>
  <h1 class="site-title">
    L'ASSASSIN<br/>
    <span class="accent-red">N'EST PAS</span> LUCAS
  </h1>
</header>

<nav>
  <a class="tag" href="#">Accueil</a>
  <a class="tag" href="#">Indices</a>
  <a class="tag" href="#">Conseils</a>
  <a class="tag" href="#">FAQ</a>
  <a class="tag" href="#">Corrections</a>
  <a class="tag active" href="#">Solution</a>
</nav>

</body>
</html>
