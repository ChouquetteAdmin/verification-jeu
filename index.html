<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Détective Yvonne</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100vh;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }
    .wrap {
      width: 100%;
      max-width: 520px;
      padding: 40px 20px;
    }
    .header { text-align: center; margin-bottom: 40px; }
    .avatar {
      width: 110px; height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #8B0000;
      display: block;
      margin: 0 auto 20px;
    }
    .name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      color: #fff;
      letter-spacing: 0.06em;
      line-height: 1;
      margin-bottom: 8px;
    }
    .subtitle {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.22em;
      color: #555;
      text-transform: uppercase;
    }
    .links { display: flex; flex-direction: column; gap: 14px; }
    .card {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px;
      text-decoration: none;
      overflow: hidden;
      padding: 14px 18px;
      gap: 16px;
      transition: background 0.2s, border-color 0.2s;
    }
    .card:hover {
      background: rgba(255,255,255,0.24);
      border-color: rgba(255,255,255,0.35);
    }
    .card-img {
      width: 42px;
      height: 60px;
      object-fit: cover;
      display: block;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .card-logo {
      width: 42px;
      height: 42px;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
    }
    .card-body { flex: 1; }
    .card-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: #aaa;
      text-transform: uppercase;
      margin-bottom: 7px;
    }
    .card-label.orange { color: #E47911; }
    .card-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 21px;
      color: #fff;
      letter-spacing: 0.05em;
      line-height: 1.15;
    }
    .card-title .red { color: #c0392b; }
    .arrow {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      flex-shrink: 0;
    }
    .social { text-align: center; margin-top: 28px; }
    .mail-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      text-decoration: none;
      transition: color 0.2s;
    }
    .mail-icon:hover { color: #fff; }
    .footer {
      text-align: center;
      margin-top: 10px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.14em;
      color: #aaa;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="header">
      <img src="yvonne.png" alt="Détective Yvonne" class="avatar"/>
      <div class="name">Détective Yvonne</div>
      <div class="subtitle">Jeux d'enquête · Livres</div>
    </div>

    <div class="links">

      <a href="/lucas" class="card">
        <img src="livrelucas.png" alt="L'Assassin n'est pas Lucas" class="card-img"/>
        <div class="card-body">
          <div class="card-label">Solution — Vérification en ligne</div>
          <div class="card-title">Affaire #1 — L'Assassin <span class="red">N'est pas</span> Lucas</div>
        </div>
        <div class="arrow" style="color:#c0392b;">→</div>
      </a>

      <a href="https://www.amazon.fr/dp/B0H1QZQS4C" target="_blank" class="card">
        <img src="amazon.png" alt="Amazon" class="card-logo"/>
        <div class="card-body">
          <div class="card-label orange">Disponible sur Amazon</div>
          <div class="card-title">Acheter L'Assassin N'est pas Lucas</div>
        </div>
        <div class="arrow" style="color:#C9A84C;">→</div>
      </a>

    </div>

    <div class="social">
      <a href="mailto:contact@detective-yvonne.com" class="mail-icon" aria-label="Envoyer un email">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="M2 7l10 7 10-7"/>
        </svg>
      </a>
    </div>

    <div class="footer">detective-yvonne.com</div>

  </div>
</body>
</html>
